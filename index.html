<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2026年銀行存款現金表</title>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Chart.js DataLabels -->
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    body { background-color: #f1f5f9; margin: 0; padding: 20px; color: #1e293b; }
    
    /* 密碼驗證遮罩 */
    #authOverlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: #0f172a;
      display: flex; justify-content: center; align-items: center;
      z-index: 9999;
    }
    .auth-box {
      background: #ffffff; padding: 32px; border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.25); text-align: center; width: 90%; max-width: 360px;
    }
    .auth-box h2 { margin-top: 0; color: #1e293b; font-size: 20px; }
    .auth-box input {
      width: 100%; padding: 10px 14px; font-size: 16px; border: 1px solid #cbd5e1;
      border-radius: 6px; margin: 16px 0 8px 0; outline: none; text-align: center; letter-spacing: 4px;
    }
    .auth-box input:focus { border-color: #3b82f6; }
    .auth-box button {
      width: 100%; padding: 10px; background: #2563eb; color: #fff;
      border: none; border-radius: 6px; font-size: 16px; font-weight: 600; cursor: pointer;
    }
    .auth-box button:hover { background: #1d4ed8; }
    .auth-error { color: #ef4444; font-size: 13px; margin-top: 8px; display: none; }

    #appContent { display: none; }
    .container { max-width: 1400px; margin: 0 auto; background: #ffffff; border-radius: 12px; box-shadow: 0 4px 16px rgba(0,0,0,0.06); padding: 24px; }
    .header { text-align: center; margin-bottom: 16px; }
    .header h1 { margin: 0 0 8px 0; font-size: 26px; color: #334155; }
    
    /* 頂部同步列 */
    .status-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; background: #f8fafc; padding: 10px 16px; border-radius: 8px; border: 1px solid #e2e8f0; }
    .sync-btn { background: #0284c7; color: #fff; border: none; border-radius: 6px; padding: 7px 16px; cursor: pointer; font-size: 13px; font-weight: 600; }
    .sync-btn:hover { background: #0369a1; }
    .save-status { font-size: 13px; color: #059669; font-weight: 600; }

    /* 新增面板 */
    .add-panel {
      background: #f0fdf4;
      border: 2px solid #22c55e;
      border-radius: 10px;
      padding: 16px 20px;
      margin-bottom: 20px;
    }
    .add-panel-title {
      font-size: 15px;
      font-weight: bold;
      color: #15803d;
      margin-bottom: 12px;
    }
    .form-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: flex-end;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
      flex: 1;
      min-width: 140px;
    }
    .form-group label {
      font-size: 13px;
      font-weight: 700;
      color: #334155;
    }
    .form-group input, .form-group select {
      height: 38px;
      padding: 6px 10px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
      background: #ffffff;
    }
    .form-group input[type="color"] {
      padding: 2px;
      cursor: pointer;
    }
    .btn-add {
      height: 38px;
      padding: 0 24px;
      background: #16a34a;
      color: #ffffff;
      font-size: 15px;
      font-weight: 700;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.2s;
    }
    .btn-add:hover { background: #15803d; }

    /* 可橫向延伸的圖表區 */
    .chart-scroll-container {
      width: 100%;
      overflow-x: auto;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 10px 0;
      margin-bottom: 20px;
      background: #ffffff;
      cursor: pointer;
    }
    .chart-wrapper {
      position: relative;
      height: 560px;
      min-width: 100%;
    }
    
    .btn-export {
      background: #10b981;
      color: #fff;
      width: 100%;
      font-size: 16px;
      height: 46px;
      margin-bottom: 16px;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-export:hover { background: #059669; }
    
    .data-table-section { margin-top: 20px; border-top: 1px solid #e2e8f0; padding-top: 16px; }
    .data-table-section summary { font-weight: 700; cursor: pointer; color: #64748b; margin-bottom: 10px; }
    .table-container { max-height: 280px; overflow-y: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 14px; }
    th, td { padding: 8px 12px; border-bottom: 1px solid #e2e8f0; }
    th { background: #f8fafc; position: sticky; top: 0; color: #475569; }
    .btn-del { background: #ef4444; color: #fff; border: none; border-radius: 4px; padding: 4px 8px; cursor: pointer; font-size: 12px; }
    .btn-edit { background: #2563eb; color: #fff; border: none; border-radius: 4px; padding: 4px 8px; cursor: pointer; font-size: 12px; margin-right: 4px; }

    /* 點擊柱子彈出的全功能編輯彈窗 */
    #editModal {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(4px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 10000;
    }
    .modal-content {
      background: #ffffff;
      width: 90%;
      max-width: 460px;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2);
      animation: modalFade 0.2s ease-out;
      position: relative;
    }
    @keyframes modalFade {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
      border-bottom: 1px solid #e2e8f0;
      padding-bottom: 10px;
    }
    .modal-header h3 { margin: 0; font-size: 18px; color: #1e293b; }
    
    .modal-close-btn {
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      color: #64748b;
      transition: all 0.2s;
    }
    .modal-close-btn:hover {
      background: #ef4444;
      color: #ffffff;
      border-color: #ef4444;
    }
    
    .modal-body { display: flex; flex-direction: column; gap: 14px; margin-bottom: 20px; }
    .modal-actions { display: flex; gap: 10px; justify-content: flex-end; align-items: center; }
    .btn-modal-save { background: #2563eb; color: #fff; padding: 9px 20px; border: none; border-radius: 6px; font-weight: 700; cursor: pointer; }
    .btn-modal-save:hover { background: #1d4ed8; }
    .btn-modal-del { background: #ef4444; color: #fff; padding: 9px 16px; border: none; border-radius: 6px; font-weight: 700; cursor: pointer; margin-right: auto; }
    .btn-modal-del:hover { background: #dc2626; }
    .btn-modal-cancel { background: #e2e8f0; color: #475569; padding: 9px 16px; border: none; border-radius: 6px; font-weight: 700; cursor: pointer; }
    .btn-modal-cancel:hover { background: #cbd5e1; }
  </style>
</head>
<body>

<div id="authOverlay">
  <div class="auth-box">
    <h2>🔒 請輸入密碼存取</h2>
    <input type="password" id="authPassword" placeholder="輸入密碼" autofocus>
    <button id="btnAuth">進入系統</button>
    <div id="authError" class="auth-error">密碼錯誤，請重新輸入</div>
  </div>
</div>

<div id="appContent">
  <div class="container">
    <div class="header">
      <h1>2026年銀行存款現金表</h1>
    </div>

    <div class="status-bar">
      <button class="sync-btn" id="btnSync">🔄 強制同步最新試算表資料</button>
      <div id="syncStatus" class="save-status">連線中...</div>
    </div>

    <!-- 新增項目面板 -->
    <div class="add-panel">
      <div class="add-panel-title">➕ 新增項目（自動同步寫入 Google 試算表）</div>
      <div class="form-row">
        <div class="form-group">
          <label for="inputDate">日期 (選擇日期，預設今日)</label>
          <input type="date" id="inputDate">
        </div>
        <div class="form-group">
          <label for="inputHongMing">泓明 (金額)</label>
          <input type="number" id="inputHongMing" placeholder="0" value="0">
        </div>
        <div class="form-group">
          <label for="inputFuBao">富堡 (金額)</label>
          <input type="number" id="inputFuBao" placeholder="0" value="0">
        </div>
        <div class="form-group">
          <label for="inputShape">特殊註記 (圖示)</label>
          <select id="inputShape">
            <option value="none">無</option>
            <option value="star">★ 星星</option>
            <option value="circle">● 圓形</option>
            <option value="triangle">▲ 三角形</option>
          </select>
        </div>
        <div class="form-group" style="max-width: 100px;">
          <label for="inputColor">註記顏色</label>
          <input type="color" id="inputColor" value="#b8860b">
        </div>
        <button class="btn-add" id="btnAdd">+ 增加項目</button>
      </div>
    </div>

    <!-- 可橫向延伸的圖表區 -->
    <div class="chart-scroll-container" id="scrollContainer" title="點擊任一長條即可編輯">
      <div class="chart-wrapper" id="chartWrapper">
        <canvas id="financeChart"></canvas>
      </div>
    </div>

    <button class="btn-export" id="btnExport">📷 輸出完整圖表為圖片 (PNG)</button>

    <!-- 資料明細列表 -->
    <details class="data-table-section">
      <summary>點此展開/收合【資料明細列表】</summary>
      <div class="table-container">
        <table id="dataTable">
          <thead>
            <tr>
              <th>日期</th>
              <th>泓明</th>
              <th>富堡</th>
              <th>合計</th>
              <th>標記</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </details>
  </div>
</div>

<!-- 點擊柱子彈出的編輯彈窗 -->
<div id="editModal">
  <div class="modal-content" onclick="event.stopPropagation()">
    <div class="modal-header">
      <h3 id="modalTitle">✏️ 編輯長條資料</h3>
      <button class="modal-close-btn" id="btnModalCloseTop">✖ 關閉</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="editIndex">
      <div class="form-group">
        <label for="modalDate">日期 (YYYY/M/D 或 YYYY-MM-DD)</label>
        <input type="text" id="modalDate">
      </div>
      <div class="form-group">
        <label for="modalHongMing">泓明價格 (金額)</label>
        <input type="number" id="modalHongMing">
      </div>
      <div class="form-group">
        <label for="modalFuBao">富堡價格 (金額)</label>
        <input type="number" id="modalFuBao">
      </div>
      <div class="form-group">
        <label for="modalShape">特殊標記</label>
        <select id="modalShape">
          <option value="none">無標記</option>
          <option value="star">★ 星星</option>
          <option value="circle">● 圓形</option>
          <option value="triangle">▲ 三角形</option>
        </select>
      </div>
      <div class="form-group">
        <label for="modalColor">標記顏色</label>
        <input type="color" id="modalColor">
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn-modal-del" id="btnModalDel">🗑️ 刪除此筆</button>
      <button class="btn-modal-cancel" id="btnModalCancel">取消關閉</button>
      <button class="btn-modal-save" id="btnModalSave">💾 儲存修改</button>
    </div>
  </div>
</div>

<script>
  const CORRECT_PWD = "719";
  const authOverlay = document.getElementById('authOverlay');
  const appContent = document.getElementById('appContent');
  const authPassword = document.getElementById('authPassword');
  const authError = document.getElementById('authError');
  const btnAuth = document.getElementById('btnAuth');
  const syncStatus = document.getElementById('syncStatus');

  function checkPassword() {
    if (authPassword.value === CORRECT_PWD) {
      authOverlay.style.display = 'none';
      appContent.style.display = 'block';
      loadGoogleSheetData();
    } else {
      authError.style.display = 'block';
      authPassword.value = '';
      authPassword.focus();
    }
  }

  btnAuth.addEventListener('click', checkPassword);
  authPassword.addEventListener('keyup', (e) => {
    if (e.key === 'Enter') checkPassword();
  });

  document.getElementById('inputDate').value = new Date().toISOString().split('T')[0];

  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzKlWIby048Ru688f50FEz7DG9Pvx_WkmXTKaEoe3SxDE_tmQAUeSNgQuVEzkD4inlxNQ/exec";

  let chartRecords = [];
  Chart.register(ChartDataLabels);

  function cleanNumber(val) {
    if (val === undefined || val === null || val === '') return 0;
    const num = String(val).replace(/,/g, '').replace(/NT\$/g, '').replace(/\$/g, '').trim();
    return parseInt(num, 10) || 0;
  }

  function cleanDate(val) {
    if (!val) return '';
    let s = String(val).trim();
    if (s.includes('T')) s = s.split('T')[0];
    s = s.replace(/[-.]/g, '/');
    const parts = s.split('/').map(p => p.trim());
    if (parts.length === 3) {
      return `${parseInt(parts[0], 10)}/${parseInt(parts[1], 10)}/${parseInt(parts[2], 10)}`;
    }
    return s;
  }

  function getFieldValue(row, possibleKeys) {
    const keys = Object.keys(row);
    for (const pKey of possibleKeys) {
      const match = keys.find(k => k.trim().toLowerCase() === pKey.toLowerCase());
      if (match && row[match] !== undefined) {
        return String(row[match]).trim();
      }
    }
    return '';
  }

  async function loadGoogleSheetData() {
    syncStatus.textContent = '⏳ 正在讀取試算表資料...';
    syncStatus.style.color = '#0284c7';

    try {
      const res = await fetch(`${APPS_SCRIPT_URL}?t=${Date.now()}`);
      const rows = await res.json();

      if (rows && rows.length > 0) {
        chartRecords = rows.map(r => {
          const rawDate = getFieldValue(r, ['日期', 'date']);
          const fubaoStr = getFieldValue(r, ['富堡', 'fubao']);
          const hongmingStr = getFieldValue(r, ['泓明', 'hongming']);
          const shapeStr = getFieldValue(r, ['標記', 'shape']) || 'none';
          const colorStr = getFieldValue(r, ['顏色', 'color']) || '#b8860b';

          return {
            date: cleanDate(rawDate),
            fubao: cleanNumber(fubaoStr),
            hongming: cleanNumber(hongmingStr),
            shape: shapeStr.toLowerCase(),
            color: colorStr
          };
        }).filter(item => item.date && item.date !== '');

        chartRecords.sort((a, b) => new Date(a.date) - new Date(b.date));
        
        initOrUpdateChart();
        renderTable();
        syncStatus.textContent = `● 已成功同步最新資料 (${new Date().toLocaleTimeString()})`;
        syncStatus.style.color = '#059669';
      } else {
        syncStatus.textContent = '▲ 試算表內無資料';
        syncStatus.style.color = '#eab308';
      }
    } catch (err) {
      syncStatus.textContent = '▲ 連線失敗，請確認 Apps Script 部署設定';
      syncStatus.style.color = '#ef4444';
    }
  }

  async function syncAllToGoogleSheet() {
    syncStatus.textContent = '⏳ 正在同步更新至 Google 試算表...';
    syncStatus.style.color = '#0284c7';

    try {
      await fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'updateAll', data: chartRecords })
      });
      syncStatus.textContent = `● 資料已成功同步儲存至 Google 試算表 (${new Date().toLocaleTimeString()})`;
      syncStatus.style.color = '#059669';
    } catch (err) {
      syncStatus.textContent = `▲ 寫入試算表失敗，但網頁畫面已更新`;
      syncStatus.style.color = '#ef4444';
    }
  }

  document.getElementById('btnAdd').addEventListener('click', async () => {
    const dateInput = document.getElementById('inputDate').value;
    const hongmingVal = parseInt(document.getElementById('inputHongMing').value) || 0;
    const fubaoVal = parseInt(document.getElementById('inputFuBao').value) || 0;
    const shapeVal = document.getElementById('inputShape').value;
    const colorVal = document.getElementById('inputColor').value;

    if (!dateInput) {
      alert('請選擇日期！');
      return;
    }

    const formattedDate = cleanDate(dateInput);
    const newRecord = {
      date: formattedDate,
      hongming: hongmingVal,
      fubao: fubaoVal,
      shape: shapeVal,
      color: colorVal
    };

    chartRecords.push(newRecord);
    chartRecords.sort((a, b) => new Date(a.date) - new Date(b.date));
    initOrUpdateChart();
    renderTable();
    syncAllToGoogleSheet();
  });

  const editModal = document.getElementById('editModal');
  const modalDate = document.getElementById('modalDate');
  const modalHongMing = document.getElementById('modalHongMing');
  const modalFuBao = document.getElementById('modalFuBao');
  const modalShape = document.getElementById('modalShape');
  const modalColor = document.getElementById('modalColor');
  const editIndex = document.getElementById('editIndex');

  window.openEditModal = function(index) {
    const item = chartRecords[index];
    if (!item) return;

    editIndex.value = index;
    modalDate.value = item.date;
    modalHongMing.value = item.hongming;
    modalFuBao.value = item.fubao;
    modalShape.value = item.shape || 'none';
    modalColor.value = item.color || '#b8860b';
    document.getElementById('modalTitle').textContent = `✏️ 編輯 ${item.date} 資料`;

    editModal.style.display = 'flex';
  };

  function closeModal() {
    editModal.style.display = 'none';
  }

  document.getElementById('btnModalCloseTop').addEventListener('click', closeModal);
  document.getElementById('btnModalCancel').addEventListener('click', closeModal);
  editModal.addEventListener('click', (e) => {
    if (e.target === editModal) closeModal();
  });
  window.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && editModal.style.display === 'flex') {
      closeModal();
    }
  });

  document.getElementById('btnModalSave').addEventListener('click', () => {
    const idx = parseInt(editIndex.value, 10);
    if (isNaN(idx) || !chartRecords[idx]) return;

    chartRecords[idx].date = cleanDate(modalDate.value) || chartRecords[idx].date;
    chartRecords[idx].hongming = cleanNumber(modalHongMing.value);
    chartRecords[idx].fubao = cleanNumber(modalFuBao.value);
    chartRecords[idx].shape = modalShape.value;
    chartRecords[idx].color = modalColor.value;

    chartRecords.sort((a, b) => new Date(a.date) - new Date(b.date));
    initOrUpdateChart();
    renderTable();
    syncAllToGoogleSheet();
    closeModal();
  });

  document.getElementById('btnModalDel').addEventListener('click', () => {
    const idx = parseInt(editIndex.value, 10);
    if (isNaN(idx) || !chartRecords[idx]) return;

    if (confirm(`確定要刪除 ${chartRecords[idx].date} 的資料嗎？`)) {
      chartRecords.splice(idx, 1);
      initOrUpdateChart();
      renderTable();
      syncAllToGoogleSheet();
      closeModal();
    }
  });

  const markerPlugin = {
    id: 'markerPlugin',
    afterDatasetsDraw(chart) {
      const { ctx } = chart;
      const metaHongming = chart.getDatasetMeta(1);
      
      chartRecords.forEach((item, index) => {
        if (!item.shape || item.shape === 'none') return;
        const elem = metaHongming.data[index];
        if (!elem) return;

        const x = elem.x;
        const y = Math.max(elem.y - 42, 35);
        
        ctx.save();
        ctx.fillStyle = item.color || '#b8860b';
        ctx.shadowColor = 'rgba(0, 0, 0, 0.25)';
        ctx.shadowBlur = 4;
        
        if (item.shape === 'star' || item.shape === '星星') {
          drawStar(ctx, x, y, 5, 20, 10);
        } else if (item.shape === 'circle' || item.shape === '圓形') {
          ctx.beginPath();
          ctx.arc(x, y, 17, 0, Math.PI * 2);
          ctx.fill();
        } else if (item.shape === 'triangle' || item.shape === '三角形') {
          ctx.beginPath();
          ctx.moveTo(x, y - 18);
          ctx.lineTo(x + 18, y + 15);
          ctx.lineTo(x - 18, y + 15);
          ctx.closePath();
          ctx.fill();
        }
        ctx.restore();
      });
    }
  };

  function drawStar(ctx, cx, cy, spikes, outerRadius, innerRadius) {
    let rot = Math.PI / 2 * 3;
    let x = cx;
    let y = cy;
    let step = Math.PI / spikes;
    ctx.beginPath();
    ctx.moveTo(cx, cy - outerRadius);
    for (let i = 0; i < spikes; i++) {
      x = cx + Math.cos(rot) * outerRadius;
      y = cy + Math.sin(rot) * outerRadius;
      ctx.lineTo(x, y);
      rot += step;
      x = cx + Math.cos(rot) * innerRadius;
      y = cy + Math.sin(rot) * innerRadius;
      ctx.lineTo(x, y);
      rot += step;
    }
    ctx.lineTo(cx, cy - outerRadius);
    ctx.closePath();
    ctx.fill();
  }

  let financeChart = null;

  function adjustChartSize() {
    const wrapper = document.getElementById('chartWrapper');
    const minBarWidth = 55;
    const requiredWidth = Math.max(chartRecords.length * minBarWidth + 120, 1000);
    wrapper.style.width = `${requiredWidth}px`;
  }

  function initOrUpdateChart() {
    adjustChartSize();

    if (!financeChart) {
      const ctx = document.getElementById('financeChart').getContext('2d');
      financeChart = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: chartRecords.map(r => r.date),
          datasets: [
            {
              label: '富堡',
              data: chartRecords.map(r => r.fubao),
              backgroundColor: '#3b82f6',
              stack: 'stack0',
              barPercentage: 0.75,
              categoryPercentage: 0.85,
              datalabels: {
                // ⭐ 富堡：文字外框 3px ⭐
                align: 'center',
                anchor: 'center',
                color: '#ffffff',
                textStrokeColor: '#0f172a',
                textStrokeWidth: 3,
                font: { weight: 'bold', size: 12 },
                formatter: val => (val && val > 0) ? val.toLocaleString() : ''
              }
            },
            {
              label: '泓明',
              data: chartRecords.map(r => r.hongming),
              backgroundColor: '#ef4444',
              stack: 'stack0',
              barPercentage: 0.75,
              categoryPercentage: 0.85,
              datalabels: {
                // ⭐ 泓明：文字外框 3px ⭐
                align: 'top',
                anchor: 'end',
                offset: 2,
                color: '#dc2626',
                textStrokeColor: '#ffffff',
                textStrokeWidth: 3,
                font: { weight: '800', size: 12 },
                formatter: val => (val && val > 0) ? val.toLocaleString() : ''
              }
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          layout: { padding: { top: 60, right: 30, left: 10 } },
          plugins: {
            legend: { position: 'top', labels: { font: { size: 14, weight: 'bold' } } },
            tooltip: {
              callbacks: {
                afterBody: (items) => {
                  let total = 0;
                  items.forEach(i => total += i.raw);
                  return `總計: NT$${total.toLocaleString()}`;
                }
              }
            }
          },
          scales: {
            x: { stacked: true, grid: { display: false }, ticks: { maxRotation: 45, minRotation: 45, font: { size: 11, weight: '600' } } },
            y: {
              stacked: true,
              beginAtZero: true,
              suggestedMax: 2000000,
              ticks: { stepSize: 200000, callback: value => 'NT$' + value.toLocaleString() },
              grid: { color: '#e2e8f0' }
            }
          },
          onClick: (e, elements) => {
            if (elements.length > 0) {
              const index = elements[0].index;
              openEditModal(index);
            }
          }
        },
        plugins: [markerPlugin]
      });
    } else {
      financeChart.data.labels = chartRecords.map(r => r.date);
      financeChart.data.datasets[0].data = chartRecords.map(r => r.fubao);
      financeChart.data.datasets[1].data = chartRecords.map(r => r.hongming);
      financeChart.update();
    }

    setTimeout(() => {
      const scrollContainer = document.getElementById('scrollContainer');
      scrollContainer.scrollLeft = scrollContainer.scrollWidth;
    }, 150);
  }

  function renderTable() {
    const tbody = document.querySelector('#dataTable tbody');
    tbody.innerHTML = '';
    chartRecords.forEach((item, index) => {
      const tr = document.createElement('tr');
      const markerText = item.shape !== 'none' ? `<span style="color:${item.color};font-weight:bold;">${item.shape}</span>` : '-';
      tr.innerHTML = `
        <td>${item.date}</td>
        <td style="color:#ef4444;font-weight:bold;">${item.hongming.toLocaleString()}</td>
        <td style="color:#2563eb;font-weight:bold;">${item.fubao.toLocaleString()}</td>
        <td>NT$${(item.hongming + item.fubao).toLocaleString()}</td>
        <td>${markerText}</td>
        <td>
          <button class="btn-edit" onclick="openEditModal(${index})">編輯</button>
          <button class="btn-del" onclick="deleteRecord(${index})">刪除</button>
        </td>
      `;
      tbody.appendChild(tr);
    });
  }

  window.deleteRecord = function(index) {
    if (confirm(`確定要刪除 ${chartRecords[index].date} 的資料嗎？`)) {
      chartRecords.splice(index, 1);
      initOrUpdateChart();
      renderTable();
      syncAllToGoogleSheet();
    }
  };

  document.getElementById('btnSync').addEventListener('click', loadGoogleSheetData);

  document.getElementById('btnExport').addEventListener('click', () => {
    const canvas = document.getElementById('financeChart');
    const tempCanvas = document.createElement('canvas');
    tempCanvas.width = canvas.width;
    tempCanvas.height = canvas.height;
    const tCtx = tempCanvas.getContext('2d');

    tCtx.fillStyle = '#ffffff';
    tCtx.fillRect(0, 0, tempCanvas.width, tempCanvas.height);
    tCtx.drawImage(canvas, 0, 0);

    const imageURL = tempCanvas.toDataURL('image/png');
    const link = document.createElement('a');
    link.download = `2026年銀行存款現金表_${new Date().toISOString().split('T')[0]}.png`;
    link.href = imageURL;
    link.click();
  });
</script>

</body>
</html>
